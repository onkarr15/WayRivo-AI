# WayRivo Backend Production & Environment Configuration Template
server:
  port: ${PORT:8085}

spring:
  application:
    name: wayrivo-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wayrivo}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:your_secure_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET:d2F5cml2by1zZWNyZXQta2V5LTMyeHgtY2hhcmFjdGVycy1taW5pbXVtLXNlY3VyZQ==}
  expiration: 86400000 # 24 hours

payment:
  gateway:
    mode: ${PAYMENT_GATEWAY_MODE:TEST_ESCROW}
    key_id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
    key_secret: ${RAZORPAY_KEY_SECRET:placeholder}

mail:
  host: ${SMTP_HOST:smtp.gmail.com}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USER:notifications@wayrivo.com}
  password: ${SMTP_PASSWORD:your_app_password}
